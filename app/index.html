<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Keine Netzwerkverbindungen: connect-src 'none'. Nur eigene Dateien (file:) und Icons vom TV. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>CleanHome</title>
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div id="wall"></div>
<div id="wall-shade"></div>
<div id="glow"></div>
<div id="wall-credit"></div>

<header id="top">
  <div id="greeting">
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
  <nav id="actions">
    <button class="pill" data-action="inputs"><svg viewBox="0 0 24 24"><path d="M3 12h11M10 7l5 5-5 5M20 4v16"/></svg>Eingänge</button>
    <button class="pill" data-action="livetv" id="btn-livetv"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Live-TV</button>
    <button class="pill" data-action="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>TV-Einstellungen</button>
    <button class="pill icon-only" data-action="customize" aria-label="Anpassen"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </nav>
</header>

<main id="main">
  <section id="shelf">
    <div id="shelf-title"></div>
    <div id="shelf-sub"></div>
  </section>
  <section id="dock-wrap"><div id="dock" class="row"></div></section>
  <section id="grid-wrap">
    <div class="section-label">Alle Apps</div>
    <div id="grid"></div>
  </section>
</main>

<section id="settings" class="hidden">
  <div id="settings-head">
    <div id="settings-title">Anpassen</div>
    <div id="settings-help">OK schaltet um · Zurück schließt</div>
  </div>
  <div id="settings-scroll"><div id="settings-list"></div></div>
</section>

<div id="overlay" class="hidden">
  <div id="sheet">
    <div id="sheet-title"></div>
    <div id="sheet-list"></div>
    <div id="sheet-hint">Zurück schließt</div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<div id="fade"></div>
<div id="hint">OK lange drücken: Verschieben · Ins Dock · Ausblenden &nbsp;·&nbsp; Blaue Taste: Anpassen</div>

<script src="js/inventory.js"></script>
<script src="js/brands.js"></script>
<script src="js/wallpapers.js"></script>
<script src="js/home.js"></script>
</body>
</html>
